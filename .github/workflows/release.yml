name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            runner: windows-latest
            target: win32-x64
            jre: jre
            archive_suffix: Windows-x64.zip
          - id: macos-intel
            label: macOS Intel
            runner: macos-15-intel
            target: darwin-x64
            jre: jre-mac-x64
            archive_suffix: macOS-Intel-x64.tar.gz
          - id: macos-apple-silicon
            label: macOS Apple Silicon
            runner: macos-15
            target: darwin-arm64
            jre: jre-mac-arm
            archive_suffix: macOS-Apple-Silicon-arm64.tar.gz
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-latest
            target: linux-x64
            jre: jre-linux-x64
            archive_suffix: Linux-x64.tar.gz
          - id: linux-arm64
            label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: linux-arm64
            jre: jre-linux-arm
            archive_suffix: Linux-ARM64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js for dependency synchronization
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync version to build files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash ./bump-version.sh "$VERSION"

      - name: Restore target-specific engine tool cache
        uses: actions/cache@v4
        with:
          path: |
            tools/yt-dlp*
            tools/ffmpeg*
            tools/deno*
          key: engine-tools-${{ matrix.target }}-${{ hashFiles('tools-manifest.json') }}

      - name: Synchronize this platform's engine tools
        run: node scripts/sync-tools.mjs --target=${{ matrix.target }}

      - name: Verify synchronized engine tools
        run: node scripts/sync-tools.mjs --target=${{ matrix.target }} --check

      - name: Build the desktop application
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean :desktop:bootJar

      - name: Build the platform-specific trimmed JRE
        shell: bash
        env:
          JRE_DIRECTORY: ${{ matrix.jre }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          analysis_dir="build/runtime-analysis"
          mkdir -p "$analysis_dir"
          (
            cd "$analysis_dir"
            jar xf "$GITHUB_WORKSPACE/desktop/build/libs/MediaSteru-$VERSION.jar"
          )
          modules=$(jdeps \
            --multi-release 21 \
            --ignore-missing-deps \
            --recursive \
            --print-module-deps \
            --class-path "$analysis_dir/BOOT-INF/lib/*" \
            "$analysis_dir/BOOT-INF/classes")
          if [[ -z "$modules" ]]; then
            echo "jdeps did not detect any Java modules for the application."
            exit 1
          fi
          # TLS loads the EC security provider dynamically, so jdeps cannot see it.
          if [[ ",$modules," != *",jdk.crypto.ec,"* ]]; then
            modules="$modules,jdk.crypto.ec"
          fi
          echo "jdeps detected application modules: $modules"
          rm -rf "tools/$JRE_DIRECTORY"
          jlink \
            --add-modules "$modules" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output "tools/$JRE_DIRECTORY"

      - name: Assemble platform-specific release folder
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          JRE_DIRECTORY: ${{ matrix.jre }}
          BUILD_OS: ${{ runner.os }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          stage="dist/MediaSteru"
          mkdir -p "$stage/tools"
          cp "desktop/build/libs/MediaSteru-$VERSION.jar" "$stage/MediaSteru.jar"
          cp tools-manifest.json "$stage/tools-manifest.json"
          cp -R "tools/$JRE_DIRECTORY" "$stage/$JRE_DIRECTORY"
          if [[ "$BUILD_OS" == "Windows" ]]; then
            cp tools/run.bat "$stage/run.bat"
          else
            cp tools/run.sh "$stage/run.sh"
            chmod +x "$stage/run.sh"
          fi
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const target = process.env.TARGET;
            const manifest = JSON.parse(fs.readFileSync("tools-manifest.json", "utf8"));
            for (const [name, tool] of Object.entries(manifest.tools)) {
              const asset = tool.targets[target];
              if (!asset) throw new Error(`Missing ${name} asset for ${target}`);
              const source = path.join("tools", asset.output);
              if (!fs.existsSync(source)) throw new Error(`Missing synchronized tool: ${source}`);
              fs.copyFileSync(source, path.join("dist/MediaSteru/tools", asset.output));
            }
          '

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: MediaSteru-${{ github.ref_name }}-${{ matrix.archive_suffix }}
        run: Compress-Archive -Path 'dist/MediaSteru/*' -DestinationPath "dist/$env:ARCHIVE"

      - name: Create macOS/Linux archive
        if: runner.os != 'Windows'
        env:
          ARCHIVE: MediaSteru-${{ github.ref_name }}-${{ matrix.archive_suffix }}
        run: tar -czf "dist/$ARCHIVE" -C dist/MediaSteru .

      - name: Show package size
        shell: bash
        env:
          ARCHIVE: MediaSteru-${{ github.ref_name }}-${{ matrix.archive_suffix }}
        run: ls -lh "dist/$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: mediasteru-release-${{ matrix.id }}
          path: dist/MediaSteru-${{ github.ref_name }}-${{ matrix.archive_suffix }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mediasteru-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2.3.2
        with:
          name: MediaSteru ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
