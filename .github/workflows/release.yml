name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package-and-release:
    name: Package & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version to build files
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          bash ./bump-version.sh "$VERSION"
          
      - name: Set up Node.js for dependency synchronization
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore engine tool cache
        uses: actions/cache@v4
        with:
          path: |
            tools/yt-dlp*
            tools/ffmpeg*
            tools/deno*
          key: engine-tools-${{ hashFiles('tools-manifest.json') }}

      - name: Synchronize checksum-verified engine tools
        run: node scripts/sync-tools.mjs --all

      - name: Verify synchronized engine tools
        run: node scripts/sync-tools.mjs --all --check

      - name: Build and Package Release Zip
        run: |
          chmod +x ./gradlew
          ./gradlew clean packageRelease

      - name: Rename Zip for Release
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mv build/distributions/MediaSteru-${VERSION}.zip build/distributions/MediaSteru-v${VERSION}-Universal.zip

      - name: Create GitHub Release & upload asset
        id: release
        uses: softprops/action-gh-release@v2.3.2
        with:
          name: "MediaSteru ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            build/distributions/MediaSteru-v${{ steps.version.outputs.VERSION }}-Universal.zip
