name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Spring Boot Engine build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
          
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar