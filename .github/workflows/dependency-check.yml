name: Dependency and version check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  project-versions:
    name: Check app version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          
      - name: Verify project versions
        run: node scripts/check-project-versions.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle can compile
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar